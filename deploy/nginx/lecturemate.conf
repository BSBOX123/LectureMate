# LectureMate 리버스 프록시
# - / → Next.js, /api·/files → Spring Boot, /ws → WebSocket
# - HTTPS 인증서는 deploy/nginx/certs 에 둔다 (fullchain.pem, privkey.pem)

upstream web_client { server web-client:3000; }
upstream api_server { server server-core:8080; }

server {
    listen 80;
    server_name _;
    # 인증서를 발급하기 전에는 아래 리다이렉트를 주석 처리하고 http 로 확인한다
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # PDF 업로드 50MB + 여유 (Spring 설정과 맞춘다)
    client_max_body_size 55m;

    location / {
        proxy_pass http://web_client;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 녹음은 오래 이어지므로 타임아웃을 늘린다
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(api|files|internal)/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE(채팅)는 버퍼링하면 스트리밍이 끊긴다
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
