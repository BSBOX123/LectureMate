name: lecturemate

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lecturemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lecturemate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 최초 볼륨 생성 시 1회만 실행됨. 이후 스키마 변경은 Flyway 마이그레이션(V2 이상)이 담당한다.
      - ./server-core/src/main/resources/db/migration/V1__init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lecturemate"]
      interval: 5s
      timeout: 5s
      retries: 10

  # macOS 에서는 컨테이너가 GPU(Metal)를 쓸 수 없고 CPU 추론도 매우 느리다(실측 0.3 tok/s).
  # Mac 개발 환경에서는 네이티브 Ollama(brew install ollama)를 쓰고 이 서비스는 띄우지 않는다.
  # Linux/EC2 GPU 서버에서는 이 서비스를 그대로 사용한다.
  ollama:
    image: ollama/ollama:latest
    container_name: lecturemate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  ollama-data:
