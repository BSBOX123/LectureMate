spring:
  application:
    name: server-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lecturemate}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  servlet:
    multipart:
      # 강의 PDF 업로드 (POST /api/v1/lectures). 요청 전체는 title 등 다른 파트를 고려해 여유를 둔다.
      max-file-size: 50MB
      max-request-size: 55MB
  flyway:
    # 스키마의 주인. 애플리케이션 기동 시 src/main/resources/db/migration 의 마이그레이션을 적용한다.
    enabled: true
    # 이미 V1 스키마가 들어 있는 DB(로컬 docker 초기화본)는 V1 적용 완료로 표시하고 V2부터 진행한다.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    # 스키마는 Flyway 마이그레이션이 관리한다. Hibernate 는 엔티티 매핑이 스키마와 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: 8080

lecturemate:
  auth:
    # 운영 환경에서는 반드시 JWT_SECRET 을 주입한다 (HS256, 최소 32바이트)
    jwt-secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32b}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 운영(HTTPS)에서는 true
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  internal:
    secret: ${INTERNAL_API_SECRET:local-dev-internal-secret}
  web-client-origin: ${WEB_CLIENT_ORIGIN:http://localhost:3000}
  fastapi:
    base-url: ${FASTAPI_ENGINE_URL:http://localhost:8000}
    connect-timeout: 5s
    read-timeout: 120s
  storage:
    local-path: ${STORAGE_LOCAL_PATH:${user.home}/lecturemate/storage}
