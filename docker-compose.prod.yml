# 운영 배포용 (GPU EC2 1대에 전부 올리는 구성)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# 로컬 개발은 docker-compose.yml(postgres 만)을 쓴다.
name: lecturemate-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 외부에 열지 않는다. 같은 compose 네트워크에서만 접근
    expose:
      - "5432"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    # GPU 사용 (nvidia-container-toolkit 필요)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ai-engine:
    build:
      context: ./ai-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SPRING_BOOT_WEBHOOK_URL: http://server-core:8080/internal/v1
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-large-v3}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      EMBEDDING_ENABLED: "true"
      LLM_BACKEND_URL: http://ollama:11434/v1
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen2.5:14b-instruct}
    volumes:
      - model-cache:/models
      - storage:/data/lecturemate/storage
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  server-core:
    build:
      context: ./server-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      FASTAPI_ENGINE_URL: http://ai-engine:8000
      STORAGE_LOCAL_PATH: /data/lecturemate/storage
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      WEB_CLIENT_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_REFRESH_COOKIE_SECURE: "true"
    volumes:
      # ai-engine 과 같은 디스크를 봐야 파일 경로 전달이 동작한다
      - storage:/data/lecturemate/storage
    expose:
      - "8080"

  web-client:
    build:
      context: ./web-client
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_ORIGIN}
    restart: unless-stopped
    depends_on:
      - server-core
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web-client
      - server-core
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/lecturemate.conf:/etc/nginx/conf.d/default.conf:ro
      # certbot 등으로 발급한 인증서를 여기에 둔다
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
  ollama-data:
  model-cache:
  storage:
